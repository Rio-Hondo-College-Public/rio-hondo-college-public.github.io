<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library (Student Quick Links)</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha512-jnSuA4Ss2PkkikSOLtYs8BlYIeeIK1h99ty4YfvRPAlzr377vr3CXDb7sb7eEEBYjDtcYj+AjBH3FLv5uSJuXg=="
      crossorigin="anonymous"
    >
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
      crossorigin="anonymous"
    >

    <link rel="stylesheet" href="../static/css/rhc-main.css">

    <style>
      .hero {
        min-height: 100vh;
        /* background: url("https://rio-hondo-college-public.github.io/static/img/interact-with-a-laptop.webp") center center / cover no-repeat; */
        position: relative;
        display: flex;
        align-items: flex-start;
        color: var(--rio-dark-gray, #333);
      }

      .hero::before {
        content: "";
        position: absolute;
        inset: 0;
        /* overlay color */
        background: rgba(var(--bs-secondary-rgb), 0.8);
        z-index: 1;
      }

      .hero p {
        max-width: 720px;
        margin: 1.5rem auto;
      }

      .container {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 100%;
      }

      .list-group {
        border-radius: 0;
        border-left-width: 0;
      }

      .list-group-item {
        background: rgba(255, 255, 255, 0);
        color: var(--light-text);
        border-left: 0;
        border-right: 0;
        padding: 0.5rem 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .list-group-item-text {
        flex: 1;
      }

      .list-group-item:hover {
        /* hover color */
        background: rgba(var(--bs-light-rgb), 0.25);
        color: var(--light-text);
      }
    </style>
  </head>

  <body>
    <main class="hero">
      <div class="container">
        <!-- <a href="BUTTON_URL" target="_blank" rel="noopener noreferrer" title="BUTTON_TEXT" class="btn btn-primary">BUTTON_TEXT</a> -->

        <!-- <div class="list-group mt-4"> -->
        <div class="list-group">
          <a
            href="https://libguides.riohondo.edu/aboutRHCLibrary/hours_closures"
            target="_blank"
            rel="noopener noreferrer"
            class="list-group-item list-group-item-action"
            title="Library Hours"
          >
            <i class="fas fa-solid fa-clock me-2"></i>
            <span class="list-group-item-text">Library Hours</span>
          </a>

          <a
            href="https://riohondo.libcal.com/reserve"
            target="_blank"
            rel="noopener noreferrer"
            class="list-group-item list-group-item-action"
            title="Reserve Study Room"
          >
            <i class="fas fa-solid fa-calendar me-2"></i>
            <span class="list-group-item-text">Reserve Study Room</span>
          </a>
          <a
            href="https://www.riohondo.edu/library/contact-us/technology-reservations/"
            target="_blank"
            rel="noopener noreferrer"
            class="list-group-item list-group-item-action"
            title="Request Technology Reservation"
          >
            <i class="fas fa-solid fa-calculator me-2"></i>
            <span class="list-group-item-text"
              >Request Technology Reservation</span
            >
          </a>

          <a
            href="https://www.riohondo.edu/library/contact-us/request-to-purchase-library-material/"
            target="_blank"
            rel="noopener noreferrer"
            class="list-group-item list-group-item-action"
            title="Request Library Acquire Item"
          >
            <i class="fas fa-solid fa-cart-shopping me-2"></i>
            <!-- <i class="fas fa-solid fa-basket-shopping me-2"></i> -->
            <span class="list-group-item-text"
              >Request Library Acquire Item</span
            >
          </a>

          <a
            href="https://libguides.riohondo.edu/libraryworkshops"
            target="_blank"
            rel="noopener noreferrer"
            class="list-group-item list-group-item-action"
            title="Workshops"
          >
            <!-- <i class="fas fa-solid fa-user-graduate me-2"></i> -->
            <i class="fas fa-solid fa-chalkboard-user me-2"></i>
            <span class="list-group-item-text">Workshops</span>
          </a>
        </div>
      </div>
    </main>

  </body>
</html>
