<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operational Support Guide</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha512-jnSuA4Ss2PkkikSOLtYs8BlYIeeIK1h99ty4YfvRPAlzr377vr3CXDb7sb7eEEBYjDtcYj+AjBH3FLv5uSJuXg=="
    crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw=="
    crossorigin="anonymous">
  <link rel="stylesheet" href="../static/css/rhc-main.css">

  <style>
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      position: relative;
      background: url("../static/img/op-support-guide-bg.png") center / cover no-repeat;
      color: var(--rio-dark-gray, #414042);
      text-align: center;
      text-decoration: none;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.90);
      transition: background-color 0.2s ease;
    }

    .hero:hover::before,
    .hero:focus-visible::before {
      background: rgba(255, 255, 255, 0.85);
    }

    .title-group {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 720px;
      letter-spacing: -1px;
    }

    .icon-circle {
      width: 85px;
      height: 85px;
      background-color: var(--rio-dark-gray);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 0.5rem;
      transition: all 0.3s ease;
    }

    .icon-circle i {
      font-size: 2.5rem;
      color: var(--light-text);
    }

    .hero:hover .icon-circle {
      transform: scale(1.08);
      box-shadow: 0 8px 24px rgba(55, 55, 55, 0.2);
    }

    .title {
      margin: 0;
      font-size: clamp(1.9rem, 6vw, 3.5rem);
      font-weight: 600;
      line-height: 1;
    }
  </style>
</head>

<body>

  <main>
    <a href="https://riohondo0.sharepoint.com/sites/OperationalSupportGuide2" target="_blank"
      rel="noopener noreferrer" title="Open the Operational Support Guide" class="hero">
      <div class="title-group">
        <div class="icon-circle">
          <i class="fas fa-book-open card-icon" aria-hidden="true"></i>
        </div>
        <h1 class="title">Operational Support Guide</h1>
      </div>
    </a>
  </main>

</body>

</html>
