<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operational Support Guide</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha512-jnSuA4Ss2PkkikSOLtYs8BlYIeeIK1h99ty4YfvRPAlzr377vr3CXDb7sb7eEEBYjDtcYj+AjBH3FLv5uSJuXg=="
    crossorigin="anonymous">
  <link rel="stylesheet" href="../static/css/rhc-main.css">

  <style>
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      position: relative;
      background: url("../static/img/op-support-guide-bg.png") center / cover no-repeat;
      color: var(--rio-dark-gray, #414042);
      text-align: center;
      text-decoration: none;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.90);
      transition: background-color 0.2s ease;
    }

    .hero:hover::before,
    .hero:focus-visible::before {
      background: rgba(255, 255, 255, 0.80);
    }

    .title-group {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 720px;
      /* letter-spacing: -1px; */
    }

    .title {
      margin: 0;
      font-size: clamp(2.1rem, 6vw, 4rem);
      font-weight: 700;
      line-height: 1;
    }
  </style>
</head>

<body>

  <main>
    <a href="https://riohondo0.sharepoint.com/sites/OperationalSupportGuide2" target="_blank"
      rel="noopener noreferrer" title="Open the Operational Support Guide" class="hero">
      <div class="title-group">
        <h1 class="title">Operational Support Guide</h1>
      </div>
    </a>
  </main>

</body>

</html>
