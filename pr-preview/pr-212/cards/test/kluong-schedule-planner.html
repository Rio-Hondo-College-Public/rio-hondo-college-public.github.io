<!DOCTYPE html>
<html lang="en"> 
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>Moodle Access Portal</title> 
  <link rel="preconnect" href="https://fonts.googleapis.com"> 
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet"> 
  <style> 
    :root { 
      --primary-color: #123986; 
      --secondary-color: #f9C900 ; 
      --accent-color: #2A6491;
      --focus-color: #ffd700; 
      --text-color: #ffffff; 
      --background-color: #ffffff; 
      --link-color: #d73502; 
      --link-hover-color: #b82d00; 
    } 

    body { 
      margin: 0; 
      padding: 0; 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      font-family: 'Roboto', sans-serif; 
      background: var(--background-color); 
    } 

    main { 
      text-align: center; 
      z-index: 1; 
      padding: 0 20px 20px 20px; /* Removed top padding */
      max-width: 800px;
    } 

    .logo { 
      width: 345px;      /* Your specific width */
      height: 83px;      /* Your specific height */
      object-fit: contain; 
      max-width: 100%; 
      margin: 0 auto 20px auto; /* 0 top margin */
      display: block;
    } 

    .button-container { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 15px; 
      margin-top: 30px;
      background-color: #f8faff; 
      padding: 40px; 
      border-radius: 12px; 
      border: 1px solid #e1e8f5;
    } 

    button { 
      text-transform: uppercase; 
      background: var(--secondary-color); 
      color: var(--text-color); 
      font-size: 1rem; 
      font-weight: 700; 
      border-radius: 0.25rem; 
      border: 2px solid transparent; 
      padding: 16px 24px; 
      min-width: 200px; 
      cursor: pointer; 
      transition: all 0.2s ease; 
      box-shadow: 0px 6px 12px rgba(50, 50, 93, 0.25); 
    } 

    button:hover { 
      background-color: var(--accent-color); 
      transform: translateY(-2px);
    }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    @media (max-width: 600px) { 
      .logo { width: 285px; height: auto; } 
    } 
  </style> 
</head> 
<body> 
  <main id="main-content"> 
    <h1 class="sr-only">Moodle Access</h1>
    
    <img src="https://collegescheduler.cachefly.net/SchoolLogos/riohondo_e4394d6aed0e.png" 
         alt="Schedule Planner Logo" 
         class="logo" /> 

    <div class="button-container"> 
      <button onclick="window.open('https://prod-ssb9-sso.riohondo.edu:8443/ssomanager/c/SSB?pkg=https://ssb.riohondo.edu:8443/prodssb/csched.p_redirect&', '_blank')" 
              type="button"> 
        Access login page 
      </button> 
    </div> 
  </main> 
</body></html>
