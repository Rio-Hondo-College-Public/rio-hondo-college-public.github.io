<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Río Hondo College News - RSS</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; line-height: 1.6; }
    h1 { color: #003366; text-align: center; }
    ul { list-style: none; padding: 0; }
    li { margin: 20px 0; padding: 15px; background: #f9f9f9; border-radius: 8px; border-left: 5px solid #003366; }
    .title { font-size: 1.25em; margin-bottom: 5px; }
    .date { color: #666; font-size: 0.95em; }
    a { color: #003366; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>Latest College News (via RSS)</h1>
  <ul id="news"></ul>

  <script>
    const rssUrl = 'https://www.riohondo.edu/category/college-news/feed/';

    fetch(rssUrl)
      .then(response => response.text())
      .then(str => new window.DOMParser().parseFromString(str, "text/xml"))
      .then(data => {
        const items = data.querySelectorAll("item");
        const list = document.getElementById('news');

        items.forEach(item => {
          const title = item.querySelector("title").textContent;
          const link = item.querySelector("link").textContent;
          const pubDate = new Date(item.querySelector("pubDate").textContent).toLocaleDateString('en-US', { 
            year: 'numeric', month: 'long', day: 'numeric' 
          });

          const li = document.createElement('li');
          li.innerHTML = `
            <div class="title"><a href="${link}" target="_blank">${title}</a></div>
            <div class="date">${pubDate}</div>
          `;
          list.appendChild(li);
        });
      })
      .catch(err => {
        document.getElementById('news').innerHTML = '<li>Unable to load RSS feed. Please check your connection.</li>';
        console.error(err);
      });
  </script>
</body>
</html>
