<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Río Hondo College News</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.6;
    }
    h1 {
      color: #003366;
      text-align: center;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      background: #f9f9f9;
      margin: 15px 0;
      padding: 15px;
      border-radius: 8px;
      border-left: 5px solid #003366;
    }
    .title {
      font-size: 1.2em;
      margin-bottom: 8px;
    }
    .date {
      color: #666;
      font-size: 0.95em;
    }
    a {
      color: #003366;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    #loading {
      text-align: center;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>Latest College News</h1>
  <div id="loading">Loading news...</div>
  <ul id="news-list"></ul>

  <script>
    const apiUrl = 'https://www.riohondo.edu/wp-json/wp/v2/posts?categories=71&per_page=5&_fields=title,link,date';

    fetch(apiUrl)
      .then(response => response.json())
      .then(posts => {
        document.getElementById('loading').style.display = 'none';
        const list = document.getElementById('news-list');

        posts.forEach(post => {
          const date = new Date(post.date).toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
          });

          const li = document.createElement('li');
          li.innerHTML = `
            <div class="title">
              <a href="${post.link}" target="_blank">${post.title.rendered}</a>
            </div>
            <div class="date">${date}</div>
          `;
          list.appendChild(li);
        });
      })
      .catch(error => {
        document.getElementById('loading').innerHTML = 
          '⚠️ Unable to load news. Please try again later.';
        console.error('Error:', error);
      });
  </script>
</body>
</html>
