<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Assistance Program (EAP)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha512-jnSuA4Ss2PkkikSOLtYs8BlYIeeIK1h99ty4YfvRPAlzr377vr3CXDb7sb7eEEBYjDtcYj+AjBH3FLv5uSJuXg=="
    crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
    crossorigin="anonymous">
  <link rel="stylesheet" href="../static/css/rhc-main.css">

  <style>
    .hero {
      min-height: 100vh;
      /* background: url('../static/img/rhc-yellow-gray-outdoor-sign_739.webp') center center / cover no-repeat; */
      position: relative;
      display: flex;
      align-items: flex-start;
      /* color: var(--rio-dark-gray, #333); */
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      /* overlay color */
      background: rgba(var(--rio-gold-rgb), 1);
      z-index: 1;
    }

    .hero p {
      max-width: 720px;
      margin: 1.5rem auto;
    }

    .container {
      padding-top: 0;
      margin-top: -1px;
    }

    /* .list-group {
      border-radius: 0;
      border-left-width: 0;
      width: 100%;
    } */

    .list-group-item {
      background: rgba(255, 255, 255, 0);
      color: var(--dark-text);
      border-bottom: 1px solid var(--dark-text);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .list-group-item:hover {
      /* hover color */
      background: rgba(255, 255, 255, 0.3);
      color: var(--dark-text);
    }

    .list-group-item i {
      flex-shrink: 0;
    }

    .list-group-item-text {
      flex: 1;
    }
  </style>
</head>

<body>
  <main class="hero">
    <div class="container">
      <div class="list-group">
        <a href="http://www.lifeworks.com/" target="_blank" rel="noopener noreferrer"
          class="list-group-item list-group-item-action" title="Visit Lifeworks (Employee Assistance Program) website">
          <i class="fas fa-globe"></i>
          <span class="list-group-item-text">
            Lifeworks (Employee Assistance Program) website
          </span>
        </a>
        <a href="https://www.riohondo.edu/wp-content/uploads/2026/01/Lifeworks-EAP-Employee-Portal-October-2014.pdf"
          target="_blank" rel="noopener noreferrer" class="list-group-item list-group-item-action"
          title="About Lifeworks (Employee Assistance Program)">
          <i class="fas fa-file-lines"></i>
          <span class="list-group-item-text">
            About Lifeworks (Employee Assistance Program)
          </span>
        </a>
        <a href="https://www.riohondo.edu/wp-content/uploads/2026/01/2014-LifeWorks-EAP-Overview.pdf" target="_blank"
          rel="noopener noreferrer" class="list-group-item list-group-item-action"
          title="LifeWorks (Employee Assistance Program) Overview">
          <i class="fas fa-file-lines"></i>
          <span class="list-group-item-text">
            LifeWorks (Employee Assistance Program) Overview
          </span>
        </a>
        <a href="https://www.riohondo.edu/wp-content/uploads/2026/01/2014-LifeWorks-Mobile-App-Information.pdf"
          target="_blank" rel="noopener noreferrer" class="list-group-item list-group-item-action"
          title="LifeWorks Mobile App Information">
          <i class="fas fa-file-lines"></i>
          <span class="list-group-item-text">
            LifeWorks Mobile App Information
          </span>
        </a>
      </div>
    </div>
  </main>

  <!-- Bootstrap JS (optional - only if you need dropdowns, modals, etc) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha512-7Pi/otdlbbCR+LnW+F7PwFcSDJOuUJB3OxtEHbg4vSMvzvJjde4Po1v4BR9Gdc9aXNUNFVUY+SK51wWT8WF0Gg=="
    crossorigin="anonymous">
  </script>
</body>

</html>
