<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counselor Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha512-jnSuA4Ss2PkkikSOLtYs8BlYIeeIK1h99ty4YfvRPAlzr377vr3CXDb7sb7eEEBYjDtcYj+AjBH3FLv5uSJuXg=="
    crossorigin="anonymous">
  <link rel="stylesheet" href="../static/css/rhc-main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;700&family=Roboto+Condensed:wght@300;400;700&display=swap"
    rel="stylesheet">

  <style>
    .card {
      height: 290px;
      display: flex;
      flex-direction: column;
      /* border: 5px solid red; */
      font-style: normal;
      font-weight: 300;
      border-bottom: none;
    }

    .card .hero-image {
      flex: 0 0 60%;
      background: url('../static/img/laptop-search-student.jpg') center center / cover no-repeat;
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center center;
      border-bottom: 0.5rem solid var(--rio-gold);
      margin-bottom: 0.1rem;
    }

    .card .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      padding: 0.6rem 1.5rem 1rem;
      background-color: #ffffff;
    }

    .btn-outline-dashboard {
      /* border: 2px solid var(--rio-dark-blue); */
      /* color: var(--rio-dark-blue); */
      border: 0.063rem solid #026BC8;
      color: #026BC8;
      background-color: transparent;
      text-transform: uppercase;
      font-weight: 700;
      font-size: 1rem;
      font-family: "Roboto Condensed", sans-serif !important;
      transition: all 0.3s ease;
      padding: 0.45rem 1rem 0.25rem;
      min-height: 2.5rem;
      border-radius: 0.25rem;
      line-height: 1.5;
      word-spacing: 0.16em;
      letter-spacing: 0.0625rem;
      min-width: 64px;
    }

    .btn-outline-dashboard:hover {
      fill: #FFFFFF;
      color: #FFFFFF;
      border-color: #065AA5;
      background-color: #065AA5;
    }

    .card .content p {
      font-family: "Noto Sans", Helvetica, Arial, sans-serif;
      font-size: 0.875rem;
      font-weight: 400;
      line-height: 1.5;
      word-spacing: 0.16em;
      margin: 0.25rem 0 0;
      color: var(--rio-dark-gray);
    }
  </style>
</head>

<body>

  <main class="card">
    <div class="hero-image" role="img" aria-label="Quick access to student information."></div>
    <div class="content">
      <a href="https://dev-ssb9-faculty.riohondo.edu:8443/FacultySelfService/ssb/searchStudent" target="_blank" rel="noopener noreferrer" title="Open Counselor Dashboard"
        class="btn btn-outline-dashboard">
        Search For Students
      </a>
      <p>Quick access to student information.</p>
    </div>
  </main>

  <!-- Bootstrap JS (optional - only if you need dropdowns, modals, etc) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha512-7Pi/otdlbbCR+LnW+F7PwFcSDJOuUJB3OxtEHbg4vSMvzvJjde4Po1v4BR9Gdc9aXNUNFVUY+SK51wWT8WF0Gg=="
    crossorigin="anonymous">
    </script>
</body>

</html>
