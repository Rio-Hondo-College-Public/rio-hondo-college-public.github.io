<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Human Resources</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha512-jnSuA4Ss2PkkikSOLtYs8BlYIeeIK1h99ty4YfvRPAlzr377vr3CXDb7sb7eEEBYjDtcYj+AjBH3FLv5uSJuXg=="
    crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
    crossorigin="anonymous">
  <link rel="stylesheet" href="../static/css/rhc-main.css">

  <style>
    .hero {
      min-height: 100vh;
      /* background: url('../static/img/i-heart-rio-sign-700.webp') center center / cover no-repeat; */
      position: relative;
      display: flex;
      align-items: flex-start;
      /* color: var(--rio-dark-gray, #333); */
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      /* overlay color */
      background: rgba(var(--rio-dark-gray-rgb), 1);
      z-index: 1;
    }

    .hero p {
      max-width: 720px;
      margin: 1.5rem auto;
    }

    .container {
      padding-top: 0;
      margin-top: -1px;
    }

    .list-group {
      color: var(--light-text);
    }

    .list-group-item {
      background: rgba(255, 255, 255, 0);
      color: var(--light-text);
      border-bottom: 1px solid var(--light-text);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .list-group-item:hover {
      /* hover color */
      background: rgba(255, 255, 255, 0.3);
      color: var(--light-text);
    }

    .list-group-item i {
      flex-shrink: 0;
    }

    .list-group-item-text {
      flex: 1;
    }
  </style>
</head>

<body>
  <main class="hero">
    <div class="container">
      <div class="list-group">


        <a href="https://www.riohondo.edu/administration/hr/employee-benefits/"
          target="_blank" rel="noopener noreferrer" class="list-group-item list-group-item-action"
          title="Explore your benefits, including health insurance, retirement plans, wellness programs, and more.">
          <i class="fas fa-file-lines"></i>
          <span class="list-group-item-text">
            Employee Benefits
          </span>
        </a>

        <a href="https://www.riohondo.edu/administration/hr/salary-schedules-hr-documents/"
          target="_blank" rel="noopener noreferrer" class="list-group-item list-group-item-action"
          title="Access salary schedules, position lists, organizational charts, holidays, and other HR documents.">
          <i class="fas fa-file-lines"></i>
          <span class="list-group-item-text">
            HR Documents and Salary Schedules
          </span>
        </a>

        <a href="https://www.riohondo.edu/administration/hr/workers-compensation/"
          target="_blank" rel="noopener noreferrer" class="list-group-item list-group-item-action"
          title="Learn about the workers’ compensation process and available support for employees.">
          <i class="fas fa-file-lines"></i>
          <span class="list-group-item-text">
            Workers' Compensation
          </span>
        </a>


      </div>
    </div>
  </main>

  <!-- Bootstrap JS (optional - only if you need dropdowns, modals, etc) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha512-7Pi/otdlbbCR+LnW+F7PwFcSDJOuUJB3OxtEHbg4vSMvzvJjde4Po1v4BR9Gdc9aXNUNFVUY+SK51wWT8WF0Gg=="
    crossorigin="anonymous">
  </script>
</body>

</html>
