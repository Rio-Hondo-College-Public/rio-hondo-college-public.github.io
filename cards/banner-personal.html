<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner Personal Information</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../static/css/rhc-main.css">

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .hero {
            min-height: 100vh;
            background-color: rgba(var(--rio-dark-gray-rgb), 0.7);
            position: relative;
            display: flex;
            align-items: center;
            color: #ffffff;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .hero:hover {
            background-color: rgba(var(--rio-dark-gray-rgb), 1);
        }

        .hero:hover .icon-circle {
            transform: scale(1.08);
            box-shadow: 0 8px 24px rgba(255, 215, 0, 0.2);
        }

        .hero:hover p {
            color: #ffffff;
        }

        .hero p {
            margin: 1.5rem auto;
            transition: color 0.3s ease;
        }

        .icon-circle {
            width: 85px;
            height: 85px;
            background-color: var(--rio-gold, #FFD700);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.5rem;
            transition: all 0.3s ease;
        }

        .icon-circle i {
            font-size: 3rem;
            color: var(--rio-dark-gray, #333);

        }

        @media only screen and (max-width: 330px) {
            .icon-circle {
                width: 80px;
                height: 80px;
            }

            .icon-circle i {
                font-size: 2.5rem;
            }
        }
    </style>
</head>

<body>
    <main>
        <a id="banner-link"
            href="https://prod-ssb9-general.riohondo.edu:8443/BannerGeneralSsb/ssb/personalInformation#/personalInformationMain"
            target="_blank" rel="noopener noreferrer" class="hero text-center"
            title="Open My Profile - Personal Information">
            <div class="container">
                <div class="icon-circle">
                    <i class="fas fa-user card-icon" aria-hidden="true"></i>

                </div>
                <h1 class="h2 mb-0">Personal Information</h1>
                <p class="py-3 my-0">View and update your contact info, email, phone, emergency contact, and other
                    personal details in Banner.</p>
            </div>
        </a>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/rhc-main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            if (typeof urlSwitch === "function") {
                urlSwitch("banner-link", "https://dev-ssb9-general.riohondo.edu:8443/BannerGeneralSsb/ssb/personalInformation#/personalInformationMain");
            }
        });
    </script>
</body>

</html>
