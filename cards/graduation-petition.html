<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graduation Petition</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../static/css/rhc-main.css">

  <style>
    .hero {
      min-height: 100vh;
      background: url('../static/img/graduates-embracing.webp') center center / cover no-repeat;
      position: relative;
      display: flex;
      align-items: center;
      /* color: red; */
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      /* overlay color */
      background: rgba(var(--rio-dark-blue-rgb), 0.85);
      z-index: 1;
    }

    .hero p {
      max-width: 720px;
      margin: 1.5rem auto;
    }

    .list-group {
      color: var(--light-text);
      margin-top: 1rem;
    }

    .list-group-item {
      background: rgba(255, 255, 255, 0);
      color: var(--light-text);
    }

    .list-group-item:hover {
      /* hover color */
      background: rgba(255, 255, 255, 0.2);
      background: rgba(var(--rio-med-blue-rgb), 0.5);
      color: var(--light-text);
    }

    h1 {
      font-weight: 900;
      font-size: clamp(1.9rem, 6vw, 2.8rem);
      color: var(--light-text);
    }

    @media only screen and (max-width: 330px) {
      .container {
        gap: 0;
      }

      .list-group {
        margin-top: 0.5rem;
      }
    }
  </style>
</head>

<body>
  <main class="hero text-center">
    <div class="container">
      <h1>Graduation Petition</h1>
      <div class="list-group">
        <a id="banner-link"
          href="https://gorio.page/gradpetition"
          target="_blank" rel="noopener noreferrer" class="list-group-item list-group-item-action"
          title="Register for Graduation Petition Application">
          Graduation Petition Application
        </a>
        <div class="list-group-item list-group-item-action"
          title="Coming Soon">
          New guide is coming soon
        </div>
        <!-- <a href="https://www.riohondo.edu/wp-content/uploads/2026/03/Graduation-Petition-Step-by-Step-Guide.pdf"
          target="_blank" rel="noopener noreferrer" class="list-group-item list-group-item-action"
          title="See guide on how to complete the Graduation Petition Application">
          How to complete the Graduation Petition Application
        </a> -->
        <a href="https://www.riohondo.edu/academics/petition-to-graduate/#deadlines" target="_blank"
          rel="noopener noreferrer" class="list-group-item list-group-item-action"
          title="Graduation Petition Deadlines">
          Deadlines
        </a>
      </div>
    </div>
  </main>

  <!-- Bootstrap JS (optional - only if you need dropdowns, modals, etc) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../static/js/rhc-main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (typeof urlSwitch === "function") {
        urlSwitch("banner-link", "https://dev-ssb9-sso.riohondo.edu:8443/ssomanager/c/SSB?pkg=https://ssb.riohondo.edu:8443/prodssb/bwzgrads.p_grad_st");
      }
    });
  </script>
</body>

</html>
