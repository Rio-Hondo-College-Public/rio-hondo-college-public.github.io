<!DOCTYPE html>
<html lang="en">

<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;

        .hero {
            min-height: 100vh;

            transition: all 0.4s ease;

        .hero:hover {
            background-color: #fad433;
            /* fallback */
            background-color: color-mix(in srgb, var(--rio-gold) 80%, var(--light-text) 20%);
        }

        .hero:hover .icon-circle {
            transform: scale(1.08);
            box-shadow: 0 8px 24px rgba(255, 215, 0, 0.9);
        }

        .hero:hover p {
            color: var(--dark-text);
        }

        .hero p {
            max-width: 720px;
            margin: 1.5rem auto;
            transition: color 0.3s ease;
            color: var(--dark-text);
        }

        .icon-circle {
            width: 85px;
            height: 85px;
            background-color: var(--rio-dark-gray);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.5rem;
            transition: all 0.3s ease;
        }

        .icon-circle i {
