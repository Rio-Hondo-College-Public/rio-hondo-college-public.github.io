<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Complaints/Grievances</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha512-jnSuA4Ss2PkkikSOLtYs8BlYIeeIK1h99ty4YfvRPAlzr377vr3CXDb7sb7eEEBYjDtcYj+AjBH3FLv5uSJuXg=="
        crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw=="
        crossorigin="anonymous">
    <link rel="stylesheet" href="../static/css/rhc-main.css">

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .hero {
            min-height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a1a1a;
            text-decoration: none;
            cursor: pointer;
            text-align: center;
            padding: 1.5rem 1rem;
            background-color: #ffffff;
            background-image: url('../static/img/two-people-sitting-outdoors.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            overflow: hidden;
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.85);
            z-index: 0;
            transition: background 0.3s ease;
        }
        
        .hero:hover::before {
            background: rgba(255, 255, 255, 0.75);
        }

        .hero:hover h1 {
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
            transform: scale(1.02);
        }

        .hero:hover p {
            color: #333333;
        }

        .title-group {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 720px;
        }

        .hero h1 {
            font-weight: 900;
            font-size: clamp(1.9rem, 6vw, 2.8rem);
            margin: 0 auto;
            line-height: 1.2;
            transition: all 0.3s ease;
            font-family: 'Roboto Condensed', sans-serif;
            letter-spacing: -0.02em;
            color: #1a1a1a;
        }

        .hero p {
            font-size: 1rem;
            margin: 1.5rem auto 0;
            max-width: 600px;
            line-height: 1.5;
            color: #333333;
            transition: color 0.3s ease;
            font-weight: 400;
        }
    </style>
</head>

<body>
    <main>
        <a href="https://cm.maxient.com/reportingform.php?RioHondoCollege&layout_id=0" target="_blank" rel="noopener noreferrer"
            title="File a Student Complaint or Grievance" class="hero">
            <div class="new-ribbon" data-created="2026-11-17"></div>
            <div class="title-group">
                <h1>Student Complaints/Grievances</h1>
                <p>Your concerns matter. File a complaint or grievance confidentially and securely.</p>
            </div>
        </a>
    </main>
    <script src="https://rio-hondo-college-public.github.io/static/js/rhc-main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            showNewRibbon();
        });
    </script>
</body>

</html>
