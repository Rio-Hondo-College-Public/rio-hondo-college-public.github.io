<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" >
  <meta name="viewport" content="width=device-width, initial-scale=1.0" >
  <title>College News</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../static/css/rhc-main.css">

  <style>
    .hero {
      min-height: 100vh;
      /* background: url('../static/img/i-heart-rio-sign-691.webp') center center / cover no-repeat; */
      position: relative;
      display: flex;
      align-items: flex-start;
      /* padding-top: 20px; */
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.85);
      z-index: 1;
    }

    .hero p {
      max-width: 720px;
      margin: 1.5rem auto;
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      min-height: 100vh;
    }

    #loading {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
      margin: 0;
      text-align: center;
      width: 100%;
    }

    .list-group-item {
      --bs-list-group-bg: transparent;
      background-color: transparent;
      border: none;
      border-bottom: 1px solid rgba(0, 0, 0, 0.2);
      color: inherit;
      border-radius: 0 !important;
    }

    .list-group-item-action:hover {
      text-decoration: underline;
      background-color: transparent;
    }

    .news-thumb {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .news-thumb-placeholder {
      width: 50px;
      height: 50px;
      background: rgba(0, 0, 0, 0.08);
      border-radius: 4px;
      flex-shrink: 0;
    }

    .news-title {
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      min-width: 0;
    }
  </style>
</head>

<body>

  <main class="hero">
    <div class="container">
      <div id="loading" class="text-muted fst-italic mb-3 text-center w-100">Loading News...</div>
      <div id="news-list" class="list-group"></div>
      <div class="text-center mt-3 mb-3">
        <a href="https://www.riohondo.edu/category/college-news/" target="_blank" rel="noopener noreferrer"
          class="btn btn-primary">More News</a>
      </div>
    </div>
  </main>

  <script>
    const apiUrl = 'https://www.riohondo.edu/wp-json/wp/v2/posts?categories=71&per_page=5&_embed=wp:featuredmedia&_fields=title,link,date,featured_media,_links';

    fetch(apiUrl)
      .then(response => response.json())
      .then(posts => {
        document.getElementById('loading').style.display = 'none';
        const list = document.getElementById('news-list');

        posts.forEach(post => {
          const date = new Date(post.date).toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
          });

          const thumbUrl = post._embedded?.['wp:featuredmedia']?.[0]?.media_details?.sizes?.thumbnail?.source_url
            || post._embedded?.['wp:featuredmedia']?.[0]?.source_url
            || null;

          const item = document.createElement('a');
          item.href = post.link;
          item.target = '_blank';
          item.rel = 'noopener noreferrer';
          item.className = 'list-group-item list-group-item-action py-2 d-flex align-items-center gap-3';
          item.innerHTML = thumbUrl
            ? `<img src="${thumbUrl}" alt="" class="news-thumb"><span class="fw-normal news-title">${post.title.rendered}</span>`
            : `<div class="news-thumb-placeholder"></div><span class="fw-normal news-title">${post.title.rendered}</span>`;
          list.appendChild(item);
        });
      })
      .catch(error => {
        document.getElementById('loading').innerHTML =
          '⚠️ Unable to load news. Please try again later.';
        console.error('Error:', error);
      });
  </script>

  <!-- Bootstrap JS (optional - only if you need dropdowns, modals, etc) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
