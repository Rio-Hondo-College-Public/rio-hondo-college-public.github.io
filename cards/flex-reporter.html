<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flex Reporter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../static/css/rhc-main.css">

  <style>
    .hero {
      min-height: 100vh;
      /* background: url('../static/img/online-training.webp') center center / cover no-repeat; */
      background-color: #ffffff;
      position: relative;
      display: flex;
      align-items: center;
      color: var(--rio-dark-gray, #333);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.85);
      z-index: 1;
    }

    .hero p {
      max-width: 720px;
      margin: 1.5rem auto;
    }

    .container {
      gap: 1rem;
    }

    a img {
      transition: transform 0.3s ease;
    }

    a:hover img {
      transform: scale(1.1);
    }
    h1{
      font-weight: 900;
      font-size: clamp(1.9rem, 6vw, 2.8rem);
    }
  </style>
</head>

<body>

  <main class="hero text-center">
    <div class="container">
      <h1>FLEX REPORTER</h1>
      <a href="https://rio.flexreporter.com/login.php" target="_blank" rel="noopener noreferrer"
        title="Log in to Flex Reporter page" class="btn btn-primary">
        Access Login Page
      </a>
    </div>
  </main>

  <!-- Bootstrap JS (optional - only if you need dropdowns, modals, etc) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
