<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library (General Info)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha512-jnSuA4Ss2PkkikSOLtYs8BlYIeeIK1h99ty4YfvRPAlzr377vr3CXDb7sb7eEEBYjDtcYj+AjBH3FLv5uSJuXg=="
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="../static/css/rhc-main.css">

    <style>
      .library-contact-info {
        width: fit-content;
        max-width: 100%;
        margin: 0 auto;
        text-align: left;
        padding: 1rem;
      }

      .library-contact-info .library-location {
        text-align: center;
      }
    </style>
  </head>

  <body>
    <main>
      <div class="container library-contact-info">
	<p class="library-location">
        <strong><a href="https://www.riohondo.edu/library" target="_blank" rel="noopener noreferrer">Learning Resource Center, 2nd Floor</a></strong>
	</p>
        <p><strong>Circulation Desk:</strong> <a href="tel:+1-562-908-3416">(562) 908-3416</a><br>
          <strong>Reference Desk:</strong> <a href="tel:+1-562-908-3484">(562) 908-3484</a><br>
          <strong>Text-a-Librarian:</strong> <a href="tel:+1-562-418-5253">(562) 418-5253</a>
	</p>
        <!-- <a
          href="https://www.riohondo.edu/library/contact-us/"
          target="_blank"
          rel="noopener noreferrer"
          class="btn btn-primary btn-lg"
          title="Contact the Library"
        >
          Contact the Library
        </a> -->
      </div>


        <!-- #### ACCORDION BEGIN #### -->
        <div class="container-fluid m-0 p-0">
          <div class="accordion" id="accordion">
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button
                  class="accordion-button collapsed"
                  type="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#collapseOne"
                  aria-expanded="false"
                  aria-controls="collapseOne"
                  title="Click to expand/collapse"
                >
                  Library Info
                </button>
              </h2>
              <div
                id="collapseOne"
                class="accordion-collapse collapse"
                data-bs-parent="#accordion"
              >
                <div class="accordion-body">
                  <ul style="list-style-type: square;">
                    <li>
                      <a href="https://libguides.riohondo.edu/aboutRHCLibrary/hours_closures"
                        target="_blank"
                        rel="noreferrer noopener"
                        title="Library Hours"
                      >
                        Library Hours
                      </a>
                    </li>
                    <li>
                      <a href="https://libguides.riohondo.edu/aboutRHCLibrary/maps"
                        target="_blank"
                        rel="noreferrer noopener"
                        title="Library Maps"
                      >
                        Library Maps
                      </a>
                    </li>
                    <li>
                      <a href="https://www.riohondo.edu/library/contact-us/library-personnel/"
                        target="_blank"
                        rel="noreferrer noopener"
                        title="Library Personnel"
                      >
                        Library Personnel
                      </a>
                    </li>
                  </ul>
                </div>
              </div>
            </div>

            <div class="accordion-item">
              <h2 class="accordion-header">
                <button
                  class="accordion-button collapsed"
                  type="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#collapseTwo"
                  aria-expanded="false"
                  aria-controls="collapseTwo"
                  title="Click to expand/collapse"
                >
                  Archives
                </button>
              </h2>
              <div
                id="collapseTwo"
                class="accordion-collapse collapse"
                data-bs-parent="#accordion"
              >
                <div class="accordion-body">
                  <ul style="list-style-type: square;">
                    <li>
                      <a href="https://libguides.riohondo.edu/archives"
                        target="_blank"
                        rel="noreferrer noopener"
                        title="RHCL Archives"
                      >
                        RHCL Archives</a
                      >
                    </li>
                    <li>
                      <a href="https://cdnc.ucr.edu/cgi-bin/cdnc?a=cl&cl=CL1&sp=ELP&e=-------en--20--1--txt-txIN--------1"
                        target="_blank"
                        rel="noreferrer noopener"
                        title="El Paisano Digital Archive"
                      >
                        El Paisano Digital Archive</a
                      >
                    </li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- #### ACCORDION END #### -->
    </main>

    <!-- Bootstrap JS (optional - only if you need dropdowns, modals, etc) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha512-7Pi/otdlbbCR+LnW+F7PwFcSDJOuUJB3OxtEHbg4vSMvzvJjde4Po1v4BR9Gdc9aXNUNFVUY+SK51wWT8WF0Gg=="
      crossorigin="anonymous"
    ></script>
  </body>
</html>
