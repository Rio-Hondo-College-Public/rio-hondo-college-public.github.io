<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8" >
  <meta name="viewport" content="width=device-width, initial-scale=1.0" >
  <title>Online Survey</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../static/css/rhc-main.css">

  <style>
    .hero {
      min-height: 100vh;
      background: url('../static/img/rhc-midquad-02.webp') center center / cover no-repeat;
      position: relative;
      display: flex;
      align-items: center;
      color: var(--rio-dark-gray, #333);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.85);
      z-index: 1;
    }
    .hero::before {
      background: linear-gradient(270deg, rgba(var(--rio-gold-rgb), 0.8), rgba(255,255,255, 0.8));
        background-size: 400% 400%;

        -webkit-animation: bg-anim 30s ease infinite;
        -moz-animation: bg-anim 30s ease infinite;
        -o-animation: bg-anim 30s ease infinite;
        animation: bg-anim 30s ease infinite;
    }

    @-webkit-keyframes bg-anim {
        0%{background-position:0% 50%}
        50%{background-position:100% 50%}
        100%{background-position:0% 50%}
    }
    @-moz-keyframes bg-anim {
        0%{background-position:0% 50%}
        50%{background-position:100% 50%}
        100%{background-position:0% 50%}
    }
    @-o-keyframes bg-anim {
        0%{background-position:0% 50%}
        50%{background-position:100% 50%}
        100%{background-position:0% 50%}
    }
    @keyframes bg-anim {
        0%{background-position:0% 50%}
        50%{background-position:100% 50%}
        100%{background-position:0% 50%}
    }

    .hero p {
      max-width: 720px;
      margin: 1.5rem auto;
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* gap: 2rem; */
    }

    a img {
      transition: transform 0.3s ease;
    }

    a:hover img {
      transform: scale(1.1);
    }
  </style>
</head>

<body>

  <main class="hero text-center">
    <div class="container">
      <!-- <img src="https://www.riohondo.edu/wp-content/themes/rio-custom-theme/assets/images/Rio-Hondo-College-logo.png" alt="Rio Hondo College Logo" class="mb-4" style="max-width: 200px;"> -->
      <h1 class="display-5 fw-bold">Help Us Improve</h1>
      <p class="fw-normal fs-5 mb-3">Share Your Thoughts on the new AccessRío</p>
      <a href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=SrksZ0kV8kmimqZ6vJdpGJemono1ohdKsV4bQZFi7zJURURIUlg2VVhHVkkwSUxCUUtPTE0yNkU2RC4u" target="_blank" rel="noopener noreferrer"
        title="Visit the online survey page" class="btn btn-primary">
        Visit Online Survey
      </a>
    </div>
  </main>

  <!-- Bootstrap JS (optional - only if you need dropdowns, modals, etc) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
