<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Need Help?</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../static/css/rhc-main.css">

  <style>
    .hero {
      min-height: 100vh;
      background: url('../static/img/iheartrio-01-2024.webp') center center / cover no-repeat;
      position: relative;
      display: flex;
      align-items: center;
      color: white;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 1;
    }

    .hero p {
      max-width: 720px;
      margin: 1.5rem auto;
    }

    #headline-container {
      position: relative;
      top: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: center;
      padding: 2rem 0 0.5rem;
    }

    #headline {
      position: absolute;
      color: var(--rio-gold);
      text-align: center;
      text-transform: uppercase;
      opacity: 1;
      font-weight: 800;
      line-height: 1;
      font-size: 1.7rem;
    }

    #headline a {
      color: #fcfcfc;
      text-decoration: underline;
      text-decoration-color: #f9c900;
      background-color: unset !important;
    }

    /* XS devices */
    @media only screen and (max-width: 375px) {
      #headline {
        font-size: 1.3rem;
      }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/typed.js/2.0.10/typed.min.js"></script>
</head>

<body>

  <main class="hero text-center text-white">
    <div class="container">
      <div id="headline-container">
        <div id="headline">
          <span id="typed">Need Help?</span>
        </div>
      </div>
      <p>
       Click
        Learn More to visit the How-To Tutorial Videos page for guides.
      </p>
      <a href="https://www.riohondo.edu/academics/how-to-tutorial-videos/" target="_blank" rel="noreferrer nopener"
        class="btn btn-primary" title="Visit RHC Academic How-To Tutorial Videos page">
        Learn More
      </a>
    </div>
  </main>



  <!-- Bootstrap JS (optional - only if you need dropdowns, modals, etc) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
