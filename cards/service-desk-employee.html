<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee IT Services</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../static/css/rhc-main.css">
  <style>
    .hero {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      color: var(--rio-dark-gray, #333);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 1);
      z-index: 1;
    }
  </style>
</head>

<body>
  <main class="hero text-center">
    <div class="container">
      <div class="rounded-circle d-flex align-items-center justify-content-center mb-2"
        style="width: 85px; height: 85px; background-color: var(--rio-gold, #FFD700);">
        <i class="fa-solid fa-headset" aria-hidden="true"
          style="font-size: 3rem; color: var(--rio-dark-gray,#333);"></i>
      </div>
      <!--<h1 class="fs-3 py-0 my-0">Employee IT Services</h1>-->
      <p class="py-3 my-0">Get help with computers, network issues, software problems, email support, and all your
        technology needs.</p>
      <a href="https://riohondocollege.zendesk.com/" target="_blank" rel="noopener noreferrer"
        title="Submit Employee IT Request" class="btn btn-primary">
        Submit Request
      </a>
    </div>
  </main>
  <!-- Bootstrap JS (optional - only if you need dropdowns, modals, etc) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
