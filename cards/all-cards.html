<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>All Cards</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" href="../static/css/rhc-main.css">
	<style>
		body {
			background: linear-gradient(180deg, #f3f8fd 0%, #ffffff 100%);
		}

		main {
			max-width: none;
			margin: 0 auto;
			padding: 1.25rem 1rem 2rem;
		}

		.heading {
			margin-bottom: 1rem;
			color: var(--rio-dark-blue);
		}

		.heading h1 {
			font-size: clamp(1.4rem, 3vw, 2rem);
			margin: 0;
		}

		.heading p {
			margin: 0.35rem 0 0;
			color: #4b5f7a;
		}

		.cards-grid {
			display: grid;
			grid-template-columns: 1fr;
			gap: 1rem;
		}

		@media (min-width: 576px) {
			.cards-grid {
				grid-template-columns: repeat(2, minmax(0, 1fr));
			}
		}

		@media (min-width: 768px) {
			.cards-grid {
				grid-template-columns: repeat(3, minmax(0, 1fr));
			}
		}

		@media (min-width: 1200px) {
			.cards-grid {
				grid-template-columns: repeat(4, minmax(0, 1fr));
			}
		}

		@media (min-width: 1800px) {
			.cards-grid {
				grid-template-columns: repeat(5, minmax(0, 1fr));
			}
		}

		.card-preview {
			width: 100%;
			border-radius: 0.75rem;
			overflow: hidden;
			border: 1px solid rgba(0, 48, 87, 0.2);
			background: #ffffff;
			box-shadow: 0 8px 20px rgba(16, 51, 83, 0.08);
		}

		.card-meta {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 0.75rem;
			padding: 0.75rem;
			border-bottom: 1px solid rgba(0, 48, 87, 0.08);
			background: #f6f9fe;
		}

		.card-title {
			margin: 0;
			font-size: 0.95rem;
			color: #0b2f4f;
			line-height: 1.2;
		}

		.open-link {
			white-space: nowrap;
			text-decoration: none;
			font-size: 0.85rem;
			font-weight: 600;
			color: #0b3f70;
		}

		.open-link:hover,
		.open-link:focus-visible {
			color: #072744;
			text-decoration: underline;
		}

		.card-frame {
			width: 100%;
			min-width: min(300px, 100%);
			max-width: 500px;
			margin-inline: auto;
			height: 290px;
			border: 0;
			display: block;
			background: #ffffff;
		}
	</style>
</head>

<body>
	<main>
		<section class="heading">
			<h1>All AccessRío Cards</h1>
			<p>Alphabetical card preview grid, similar to Experience embedded cards.</p>
		</section>

		<section id="cardsGrid" class="cards-grid" aria-label="Card previews"></section>
	</main>

	<script>
		// Option 1: maintain this list manually when cards are added, removed, or renamed.
		// Automatically generated list of all HTML files in the cards folder and subfolders (excluding all-cards.html itself)
		const cardFiles = [
			"legacie-registration.html",
			"diligent.html",
			"diligent2.html",
			"schedule-planner.html",
			"pre-reg-survey.html",
			"add-drop-classes.html",
			"a-width-height.html",
			"banner-personal-test.html",
			"banner-personal.html",
			"banner-reports-test.html",
			"banner-reports.html",
			"banner-self-service-test.html",
			"banner-self-service.html",
			"banner-test.html",
			"banner.html",
			"career-resources.html",
			"college-news.html",
			"curriqunet.html",
			"directory.html",
			"eap.html",
			"employee-forms.html",
			"employee-links.html",
			"flex-reporter.html",
			"graduation-petition.html",
			"handshake.html",
			"human-resources.html",
			"human-resources2.html",
			"institutional-effectiveness.html",
			"kronos.html",
			"need-help.html",
			"online-training.html",
			"parking.html",
			"payroll.html",
			"reports.html",
			"service-desk-employee.html",
			"service-desk-student.html",
			"students-grades.html",
			"students-transcript.html",
			"survey.html",
			"test-banner.html",
			"test-instances.html",
			"test-instances-blue.html",
			"test-instances-green.html",
			"test-instances-gray.html",
			"training.html",
			"web-apps-2.html",
			"welcome.html"
		];

		function toLabel(fileName) {
			const name = fileName.replace(/\.html$/i, "").replace(/-/g, " ").trim();
			return name
				.split(/\s+/)
				.map((part) => part.charAt(0).toUpperCase() + part.slice(1))
				.join(" ");
		}

		const cards = cardFiles
			.map((fileName) => ({ fileName, title: toLabel(fileName) }))
			.sort((a, b) => a.title.localeCompare(b.title, undefined, { sensitivity: "base", numeric: true }));

		const grid = document.getElementById("cardsGrid");
		grid.innerHTML = cards
			.map(({ fileName, title }) => `
				<article class="card-preview">
					<header class="card-meta">
						<h2 class="card-title">${title}</h2>
						<a class="open-link" href="${fileName}" target="_blank" rel="noopener noreferrer">Open</a>
					</header>
					<iframe class="card-frame" src="${fileName}" loading="lazy" title="${title} preview"></iframe>
				</article>
			`)
			.join("");
	</script>
</body>

</html>
