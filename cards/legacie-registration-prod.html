<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legacie Registration Link</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha512-jnSuA4Ss2PkkikSOLtYs8BlYIeeIK1h99ty4YfvRPAlzr377vr3CXDb7sb7eEEBYjDtcYj+AjBH3FLv5uSJuXg=="
        crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw=="
        crossorigin="anonymous">
    <link rel="stylesheet" href="../static/css/rhc-main.css">

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .hero {
            min-height: 100vh;
            background-color: var(--light-text);
            position: relative;
            display: flex;
            align-items: center;
            color: var(--dark-text);
            text-decoration: none;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .hero:hover {
            background-color: var(--rio-green);
        }

        .hero:hover p {
            color: var(--dark-text);
        }

        .hero p {
            max-width: 720px;
            margin: 1.5rem auto;
            transition: color 0.3s ease;
        }
        .container img{
            max-width: 100%;
            width: 250px;
            height: auto;
        }

    </style>
</head>

<body>
    <main>
        <a href="https://prod-ssb9-general.riohondo.edu:8443/BannerExtensibility/customPage/page/LEGACIE" target="_blank"
            rel="noopener noreferrer" class="hero text-center" title="Visit the Río Hondo College LEGACIE+ Registration Form">
            <div class="container">
                <img src="https://www.riohondo.edu/wp-content/uploads/2024/12/LEGACIEx2.png" alt="Legacie Logo" class="img-fluid">
                <p class="py-3 my-0">RHC LEGACIE+ MSI Registration Form</p>
            </div>
        </a>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha512-7Pi/otdlbbCR+LnW+F7PwFcSDJOuUJB3OxtEHbg4vSMvzvJjde4Po1v4BR9Gdc9aXNUNFVUY+SK51wWT8WF0Gg=="
        crossorigin="anonymous">
    </script>
</body>

</html>
