<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vision Resource Center</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha512-jnSuA4Ss2PkkikSOLtYs8BlYIeeIK1h99ty4YfvRPAlzr377vr3CXDb7sb7eEEBYjDtcYj+AjBH3FLv5uSJuXg=="
    crossorigin="anonymous">
  <link rel="stylesheet" href="../static/css/rhc-main.css">

  <style>
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      text-decoration: none;
      font-size: large;
      transition: background-color 0.2s ease;
    }

    .hero:hover,
    .hero:focus-visible {
      background-color: #e9e9e9;
    }

    .title-group {
      width: 100%;
      max-width: 520px;
      text-align: center;
      color: var(--rio-dark-gray, #414042);
      letter-spacing: -1px;
    }

    .title {
      margin: 0;
      font-weight: 600;
      line-height: 0.95;
      font-size: 3rem;
      font-weight: 900;
    }

    .subtitle {
      margin: 0.15em 0 0;
      font-weight: 500;
      line-height: 1.1;
      font-size: 2.2rem;
    }

    .rule {
      height: 3px;
      margin: clamp(0.9rem, 4vw, 1.75rem) auto;
      border: 0;
      background-color: #a0a0a0;
      opacity: 1;
      width: 80%;
    }

    .logo {
      display: block;
      width: 180px;
      height: auto;
      margin: 0 auto;
    }
  </style>
</head>

<body>

  <main>
    <a href="https://cccpln.csod.com/samldefault.aspx?ouid=100" target="_blank" rel="noopener noreferrer"
      title="Log in to Vision Resource Center" class="hero">
      <div class="title-group">
        <h1 class="title">Vision</h1>
        <h2 class="subtitle">Resource Center</h2>
        <hr class="rule">
        <img class="logo" src="../static/img/ccc-logo-vfull-3c.png" alt="California Community Colleges">
      </div>
    </a>
  </main>

</body>

</html>
