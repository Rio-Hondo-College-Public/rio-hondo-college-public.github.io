<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handshake</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../static/css/rhc-main.css">

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .hero {
            min-height: 100vh;
            background-color: var(--rio-dark-gray);
            position: relative;
            display: flex;
            align-items: center;
            color: #ffffff;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .hero:hover {
            background-color: rgba(255,255,255, 0.3);
        }

        .hero:hover .icon-circle {
            transform: scale(1.08);
            box-shadow: 0 8px 24px rgba(255, 215, 0, 0.2);
        }

        .hero:hover p {
            color: #ffffff;
        }

        .hero p {
            max-width: 720px;
            margin: 1.5rem auto;
            transition: color 0.3s ease;
        }

        .container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }

        .icon-circle {
            width: 85px;
            height: 85px;
            background-color: var(--rio-gold, #FFD700);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.5rem;
            transition: all 0.3s ease;
        }

        .icon-circle i {
            font-size: 3rem;
            color: var(--rio-dark-gray, #333);

        }

        .container img {
            max-width: 300px;
            height: auto;
        }

        @media (max-width: 300px) {
            .container img {
                max-width: 230px;
            }
        }
    </style>
</head>

<body>
    <main>
        <a href="https://riohondo.joinhandshake.com/login" target="_blank" rel="noopener noreferrer"
            class="hero text-center" title="Visit Río Hondo Handshake Portal">
            <div class="container">
                <img src="../static/img/handshake-white.png" alt="Handshake Logo" style="margin-bottom: 0.5rem;">
                <p class="py-3 my-0">Access the Río Hondo College Handshake portal for career services and job
                    opportunities.</p>
            </div>
        </a>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
