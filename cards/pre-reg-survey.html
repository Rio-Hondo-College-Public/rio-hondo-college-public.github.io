<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Registration Survey</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../static/css/rhc-main.css">

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .hero {
            min-height: 100vh;
            background-color: var(--rio-gold);
            position: relative;
            display: flex;
            align-items: center;
            color: var(--dark-text);
            text-decoration: none;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .hero:hover {
            background-color: #fad433;
            /* fallback */
            background-color: color-mix(in srgb, var(--rio-gold) 80%, var(--light-text) 20%);
        }

        .hero:hover .icon-circle {
            transform: scale(1.08);
            box-shadow: 0 8px 24px rgba(255, 215, 0, 0.9);
        }

        .hero:hover p {
            color: var(--dark-text);
        }

        .hero p {
            max-width: 720px;
            margin: 1.5rem auto;
            transition: color 0.3s ease;
            color: var(--dark-text);
        }

        .icon-circle {
            width: 85px;
            height: 85px;
            background-color: var(--rio-dark-gray);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.5rem;
            transition: all 0.3s ease;
        }

        .icon-circle i {
            font-size: 3rem;
            color: var(--light-text);
        }
    </style>
</head>

<body>
    <main>
        <a id="banner-link" href="https://prod-ssb9-general.riohondo.edu:8443/BannerExtensibility/customPage/page/VTEA"
            target="_blank" rel="noopener noreferrer" class="hero text-center" title="Pre-Registration (VTEA) Survey. This survey helps Río Hondo College qualify for additional funding to equip your labs and be eligible for additional program grants.">
            <div class="container">
                <div class="icon-circle">
                    <i class="fas fa-clipboard-list card-icon" aria-hidden="true"></i>
                </div>
                <h1 class="h2 mb-0">Pre-Registration Survey</h1>
                <p class="py-3 my-0">This survey is important for students at Río Hondo College.</p>
            </div>
        </a>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/rhc-main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            if (typeof urlSwitch === "function") {
                urlSwitch("banner-link", "https://dev-ssb9-general.riohondo.edu:8443/BannerExtensibility/customPage/page/VTEA");
            }
        });
    </script>
</body>

</html>
