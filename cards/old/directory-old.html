<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8" >
  <meta name="viewport" content="width=device-width, initial-scale=1.0" >
  <title>Department/Staff Directory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../static/css/rhc-main.css">

  <style>
    .hero {
      min-height: 100vh;
      background: url('../static/img/rhc-mid-quad-01.webp') center center / cover no-repeat;
      position: relative;
      display: flex;
      align-items: center;
      color: var(--rio-dark-gray, #333);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.90);
      z-index: 1;
    }

    .hero p {
      max-width: 720px;
      margin: 1.5rem auto;
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
    }

    a img {
      transition: transform 0.3s ease;
    }

    a:hover img {
      transform: scale(1.1);
    }
  </style>
</head>

<body>

  <main class="hero text-center">
    <div class="container">
      <div class="rounded-circle d-flex align-items-center justify-content-center mb-2"
        style="width: 85px; height: 85px; background-color: var(--rio-gold, #FFD700);">
        <i class="fa-solid fa-address-book" aria-hidden="true"
          style="font-size: 3rem; color: var(--rio-dark-gray,#333);"></i>
      </div>
      <!--<h1 class="fs-3 py-0 my-0">Department/Staff Directory</h1>-->
      <p class="py-3 my-0">Find Río Hondo College department and staff contact information.</p>
      <a href="https://gorio.page/directory" target="_blank" rel="noopener noreferrer"
        title="Open Department/Staff Directory" class="btn btn-primary">
        Open Directory
      </a>
    </div>
  </main>

  <!-- Bootstrap JS (optional - only if you need dropdowns, modals, etc) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
