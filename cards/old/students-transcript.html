<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student's Transcript</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../static/css/rhc-main.css">

  <style>
    .hero {
      min-height: 100vh;
      background: url('../static/img/rhc-turf-quad.webp') center center / cover no-repeat;
      position: relative;
      display: flex;
      align-items: flex-start;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      /* overlay color */
      background: rgba(var(--rio-gold-rgb), 0.9);
      z-index: 1;
    }

    .hero p {
      max-width: 720px;
      margin: 1.5rem auto;
    }

    .list-group-item {
      background: rgba(255, 255, 255, 0);
      color: var(--dark-text);
    }

    .list-group-item:hover {
      /* hover color */
      background: rgba(255, 255, 255, 0.3);
      color: var(--dark-text);
    }


    .list-group-item i {
      flex-shrink: 0;
    }

    .list-group-item-text {
      flex: 1;
    }
  </style>
</head>

<body>

  <main class="hero">
    <div class="container">
      <div class="list-group">
        <a href="https://prod-ssb9-student.riohondo.edu:8443/StudentSelfService/ssb/academicTranscript" target="_blank"
          rel="noopener noreferrer" class="list-group-item list-group-item-action" title="View Unofficial Transcript">
          <i class="fas fa-file-lines"></i>
          <span class="list-group-item-text">
            View Unofficial Transcript
          </span>
        </a>

        <a href="https://www.parchment.com/u/registration/34612/institution" target="_blank" rel="noopener noreferrer"
          class="list-group-item list-group-item-action" title="Request Official Transcript">
          <span class="list-group-item-text">
            <i class="fas fa-paper-plane"></i>
            Request Official Transcript
          </span>
        </a>

      </div>
    </div>
  </main>

  <!-- Bootstrap JS (optional - only if you need dropdowns, modals, etc) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
