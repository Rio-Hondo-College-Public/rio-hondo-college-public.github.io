<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scholarships</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha512-jnSuA4Ss2PkkikSOLtYs8BlYIeeIK1h99ty4YfvRPAlzr377vr3CXDb7sb7eEEBYjDtcYj+AjBH3FLv5uSJuXg=="
    crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw=="
    crossorigin="anonymous">
  <link rel="stylesheet" href="../static/css/rhc-main.css">

  <style>
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      position: relative;
      background: var(--rio-green);
      color: var(--dark-text);
      text-align: center;
      text-decoration: none;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(51, 169, 97, 0.90);
      transition: background-color 0.2s ease;
    }

    .hero:hover::before,
    .hero:focus-visible::before {
      background: rgba(51, 169, 97, 0.85);
    }

    .title-group {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 720px;
    }

    .icon-circle {
      width: 85px;
      height: 85px;
      background-color: var(--rio-gold);
      /* background-color: var(--light-text); */
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 0.5rem;
      transition: all 0.3s ease;
    }

    .icon-circle i {
      font-size: 2.5rem;
      color: var(--dark-text);
    }

    .hero:hover .icon-circle {
      transform: scale(1.08);
      box-shadow: 0 8px 24px rgba(249, 201, 0, 0.3);
    }

  </style>
</head>

<body>

  <main>
    <a href="https://rio.awardspring.com/AS/public-scholarships" target="_blank"
      rel="noopener noreferrer" title="Open Scholarships" class="hero">
      <div class="title-group">
        <div class="icon-circle">
          <i class="fas fa-graduation-cap card-icon" aria-hidden="true"></i>
        </div>
        <h1 class="fs-1 my-2 mb-0">Scholarships</h1>
      </div>
    </a>
  </main>

</body>

</html>
