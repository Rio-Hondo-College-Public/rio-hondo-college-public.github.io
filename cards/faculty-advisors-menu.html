<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty and Advisors Menu (Banner8)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha512-jnSuA4Ss2PkkikSOLtYs8BlYIeeIK1h99ty4YfvRPAlzr377vr3CXDb7sb7eEEBYjDtcYj+AjBH3FLv5uSJuXg=="
    crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
    crossorigin="anonymous">
  <link rel="stylesheet" href="../static/css/rhc-main.css">

  <style>
    .hero {
      min-height: 100vh;
      /* background: url('../static/img/forms.jpg') center center / cover no-repeat; */
      position: relative;
      display: flex;
      align-items: flex-start;
      color: var(--rio-dark-gray, #333);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      /* overlay color */
      background: rgba(var(--rio-dark-blue-rgb), 1);
      z-index: 1;
    }

    .container {
      padding-top: 0;
      margin-top: -1px;
    }

    .list-group {
      color: var(--light-text);
    }

    .login-notice {
      width: 100%;
      margin: 0 0 1rem;
      color: var(--light-text);
      text-align: center;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .list-group-item {
      background: rgba(255, 255, 255, 0);
      color: var(--light-text);
      display: flex;
      align-items: center;
      /* gap: 0.5rem; */
    }

    .list-group-item i {
      flex-shrink: 0;
    }

    .list-group-item.list-group-item-action:hover,
    .list-group-item.list-group-item-action:focus-visible,
    .list-group-item.list-group-item-action:active {
      /* mouse hover, keyboard focus, and pressed state */
      background: rgba(var(--rio-med-blue-rgb), 0.5);
      color: var(--light-text);
    }
  </style>
</head>

<body>
  <main class="hero">
    <div class="container">
      <p class="login-notice">
        These links open applications that may require a separate sign-in.
      </p>
      <div class="list-group">
        <a href="https://ssb.riohondo.edu:8443/prodssb/bwlkasgn.P_FacActAssign" target="_blank"
          rel="noopener noreferrer" class="list-group-item list-group-item-action"
          title="Active Assignments">
          <i class="fa-solid fa-caret-right"></i>
          Active Assignments
        </a>
        <a href="https://ssb.riohondo.edu:8443/prodssb/bwlkostm.P_FacSelTerm" target="_blank"
          rel="noopener noreferrer" class="list-group-item list-group-item-action"
	  title="Term Selection">
          <i class="fa-solid fa-caret-right"></i>
          Term Selection
        </a>
        <a href="https://ssb.riohondo.edu:8443/prodssb/bwlkocrn.P_FacCrnSel" target="_blank"
          rel="noopener noreferrer" class="list-group-item list-group-item-action"
          title="CRN Selection">
          <i class="fa-solid fa-caret-right"></i>
          CRN Selection
        </a>
        <a href="https://ssb.riohondo.edu:8443/prodssb/bwlkfcwl.P_FacClaListSum" target="_blank"
          rel="noopener noreferrer" class="list-group-item list-group-item-action"
	  title="Summer Class List">
          <i class="fa-solid fa-caret-right"></i>
          Summer Class List
        </a>
        <a href="https://ssb.riohondo.edu:8443/prodssb/bwlkfcwl.P_FacWaitListSum" target="_blank"
          rel="noopener noreferrer" class="list-group-item list-group-item-action"
          title="Summer Wait List">
          <i class="fa-solid fa-caret-right"></i>
          Summer Wait List
        </a>
        <a href="https://ssb.riohondo.edu:8443/prodssb/bwlkincg.P_FacIncmpGrdSum" target="_blank"
          rel="noopener noreferrer" class="list-group-item list-group-item-action"
          title="Incomplete Grades Summary">
          <i class="fa-solid fa-caret-right"></i>
          Incomplete Grades Summary
        </a>
        <a href="https://ssb.riohondo.edu:8443/prodssb/bwlkgrde.P_FacFinGrd" target="_blank"
          rel="noopener noreferrer" class="list-group-item list-group-item-action"
          title="Faculty Grade Summary">
          <i class="fa-solid fa-caret-right"></i>
          Faculty Grade Summary
        </a>
        <a href="https://ssb.riohondo.edu:8443/prodssb/bwlkasgn.P_FacAssignHist" target="_blank"
          rel="noopener noreferrer" class="list-group-item list-group-item-action"
	  title="Assignment History">
          <i class="fa-solid fa-caret-right"></i>
          Assignment History
        </a>
        <a href="https://ssb.riohondo.edu:8443/prodssb/bwlkgrde.P_advfingrd" target="_blank"
          rel="noopener noreferrer" class="list-group-item list-group-item-action"
	  title="Advisee Grade Summary">
          <i class="fa-solid fa-caret-right"></i>
          Advisee Grade Summary
        </a>
        <a href="https://ssb.riohondo.edu:8443/prodssb/pw_pub_sched.p_search" target="_blank"
          rel="noopener noreferrer" class="list-group-item list-group-item-action"
	  title="Class Schedule">
          <i class="fa-solid fa-caret-right"></i>
          Class Schedule
        </a>
      </div>
    </div>
  </main>

</body>

</html>
