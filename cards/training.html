<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Training</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../static/css/rhc-main.css">

  <style>
    .hero {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      color: var(--rio-dark-gray, #333);
      background-color: var(--rio-gold, #f0c040);
      /* padding: 1rem; */
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      /* background: rgba(255, 255, 255, 0.85); */
      z-index: 1;
    }

    .container img {
      max-width: 100px;
      height: auto;
      border-radius: 50%;
      margin: 1rem 0;
    }

    a img {
      transition: transform 0.3s ease;
    }

    a:hover img {
      transform: scale(1.1);
    }

    @media (max-width: 300px) {
      .container img {
        max-width: 230px;
      }
    }
  </style>
</head>

<body>

  <main class="hero text-center">
    <div class="container">
      <h1 class="fw-bold mb-1">Need Training?</h1>
      <!-- <div>Please contact </div> -->

      </div>
      <img src="../static/img/ejlopez_profile.jpg" alt="Enrique Lopez profile" class="img-fluid">
      <div class="d-flex justify-content-center align-items-center gap-4 fs-5"
        style="color: var(--rio-dark-gray, #333);">

          <i class="fas fa-envelope text-secondary"></i>
        </a>
        <a href="tel:+15624637775" title="Call Enrique Lopez" class="text-decoration-none">
          <i class="fas fa-phone text-secondary"></i>
        </a>
        <!-- these Teams links are currently not working on Experience environment. Disabling for now

        <a href="https://teams.microsoft.com/l/call/0/0?users=EJLopez@riohondo.edu"
